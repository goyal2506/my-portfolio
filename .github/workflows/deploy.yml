name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    if: ${{ !contains(github.event.head_commit.message, '[skip ci]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: yarn

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Build
        run: yarn build

      - name: Publish built site to main branch root
        run: |
          cp dist/index.html index.html
          cp dist/404.html 404.html
          cp dist/favicon.svg favicon.svg
          cp dist/.nojekyll .nojekyll
          rm -rf assets
          cp -r dist/assets assets
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html 404.html favicon.svg .nojekyll assets
          git diff --staged --quiet || git commit -m "Deploy built site [skip ci]"
          git push
